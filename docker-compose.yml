name: aqress-pulse

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aqress_pulse}
      POSTGRES_USER: ${POSTGRES_USER:-aqress_pulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aqress-pulse-local-only}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  emqx:
    build:
      context: ./emqx
    environment:
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USERNAME:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-aqress-pulse-local-only}
      EMQX_NODE__COOKIE: ${EMQX_NODE_COOKIE:-aqress-pulse-local-cookie-change-me}
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${EMQX_DASHBOARD_PORT:-18083}:18083"
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    depends_on:
      mqtt-auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: local
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aqress_pulse}:${POSTGRES_PASSWORD:-aqress-pulse-local-only}@postgres:5432/${POSTGRES_DB:-aqress_pulse}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aqress_pulse}:${POSTGRES_PASSWORD:-aqress-pulse-local-only}@postgres:5432/aqress_pulse_test
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-only-change-this-secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      AQRESS_PULSE_ADMIN_EMAIL: ${AQRESS_PULSE_ADMIN_EMAIL:-admin@aqress.dev}
      AQRESS_PULSE_ADMIN_PASSWORD: ${AQRESS_PULSE_ADMIN_PASSWORD:-change-me-before-seeding}
      AQRESS_PULSE_ADMIN_FIRST_NAME: ${AQRESS_PULSE_ADMIN_FIRST_NAME:-Local}
      AQRESS_PULSE_ADMIN_LAST_NAME: ${AQRESS_PULSE_ADMIN_LAST_NAME:-Administrator}
      MQTT_HOST: emqx
      MQTT_PORT: 1883
      MQTT_PLATFORM_USERNAME: ${MQTT_PLATFORM_USERNAME:-platform:control}
      MQTT_PLATFORM_PASSWORD: ${MQTT_PLATFORM_PASSWORD:-local-platform-control-change-me}
      MQTT_KEEPALIVE_SECONDS: ${MQTT_KEEPALIVE_SECONDS:-30}
      DEVICE_OFFLINE_TIMEOUT_SECONDS: ${DEVICE_OFFLINE_TIMEOUT_SECONDS:-90}
      DEVICE_OFFLINE_CHECK_INTERVAL_SECONDS: ${DEVICE_OFFLINE_CHECK_INTERVAL_SECONDS:-10}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  mqtt-auth:
    build:
      context: ./backend
    command: ["uvicorn", "app.internal:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aqress_pulse}:${POSTGRES_PASSWORD:-aqress-pulse-local-only}@postgres:5432/${POSTGRES_DB:-aqress_pulse}
      MQTT_PLATFORM_USERNAME: ${MQTT_PLATFORM_USERNAME:-platform:control}
      MQTT_PLATFORM_PASSWORD: ${MQTT_PLATFORM_PASSWORD:-local-platform-control-change-me}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/internal/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  mqtt-worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.mqtt.worker"]
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aqress_pulse}:${POSTGRES_PASSWORD:-aqress-pulse-local-only}@postgres:5432/${POSTGRES_DB:-aqress_pulse}
      MQTT_HOST: emqx
      MQTT_PORT: 1883
      MQTT_PLATFORM_USERNAME: ${MQTT_PLATFORM_USERNAME:-platform:control}
      MQTT_PLATFORM_PASSWORD: ${MQTT_PLATFORM_PASSWORD:-local-platform-control-change-me}
      MQTT_KEEPALIVE_SECONDS: ${MQTT_KEEPALIVE_SECONDS:-30}
      DEVICE_OFFLINE_TIMEOUT_SECONDS: ${DEVICE_OFFLINE_TIMEOUT_SECONDS:-90}
      DEVICE_OFFLINE_CHECK_INTERVAL_SECONDS: ${DEVICE_OFFLINE_CHECK_INTERVAL_SECONDS:-10}
    depends_on:
      backend:
        condition: service_healthy
      emqx:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('emqx', 1883), 2).close()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  simulator:
    profiles: ["simulator"]
    build:
      context: ./simulator
    environment:
      SIMULATOR_DEVICE_UID: ${SIMULATOR_DEVICE_UID:-}
      SIMULATOR_MQTT_USERNAME: ${SIMULATOR_MQTT_USERNAME:-}
      SIMULATOR_MQTT_PASSWORD: ${SIMULATOR_MQTT_PASSWORD:-}
      SIMULATOR_HEARTBEAT_INTERVAL_SECONDS: ${SIMULATOR_HEARTBEAT_INTERVAL_SECONDS:-15}
      SIMULATOR_FIRMWARE_VERSION: ${SIMULATOR_FIRMWARE_VERSION:-0.1.0}
      SIMULATOR_FORCE_CONFIG_FAILURE: ${SIMULATOR_FORCE_CONFIG_FAILURE:-false}
      MQTT_HOST: emqx
      MQTT_PORT: 1883
    depends_on:
      emqx:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  emqx_data:
  emqx_log:
